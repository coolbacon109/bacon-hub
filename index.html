<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title id="page-title">Resources</title>
  <link id="page-favicon" rel="icon" type="image/png" href="https://s2.googleusercontent.com/s2/favicons?domain=clever.com&sz=128">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
    
    body { background-color: #050505; overflow: hidden; color: #f8fafc; }

    .ambient-blob {
      position: absolute; filter: blur(90px); z-index: 0; opacity: 0.5;
      animation: float 20s infinite ease-in-out alternate;
    }
    .blob-1 { background: #ea580c; width: 60vw; height: 60vw; top: -20%; left: -10%; border-radius: 50%; } 
    .blob-2 { background: #7e22ce; width: 50vw; height: 50vw; bottom: -10%; right: -10%; border-radius: 50%; animation-delay: -5s; } 
    .blob-3 { background: #991b1b; width: 40vw; height: 40vw; top: 40%; left: 40%; border-radius: 50%; animation-delay: -10s; } 

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, 10%) scale(1.1); }
    }

    @keyframes smoothPopIn {
      0% { opacity: 0; transform: translateY(20px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .animate-pop { animation: smoothPopIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    #emoji-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1; overflow: hidden; opacity: 1; 
    }
